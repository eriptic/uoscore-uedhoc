# uoscore-uedhoc, built by this repository's Zephyr module (zephyr/Kconfig),
# with Zephyr's zcbor and Mbed TLS (PSA Crypto) modules.
CONFIG_ZCBOR=y
CONFIG_ZCBOR_CANONICAL=y
CONFIG_UOSCORE=y
CONFIG_UEDHOC=y
CONFIG_UOSCORE_UEDHOC_COMPACT25519=y
CONFIG_UOSCORE_UEDHOC_UNIT_TEST=y
# mocks/nvm.c implements nvm_write_ssn()/nvm_read_ssn()
CONFIG_UOSCORE_NVM_CUSTOM=y
CONFIG_UOSCORE_NVM_SUPPORT=y

CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=10000
CONFIG_INIT_STACKS=y

# enable to use thread names
CONFIG_THREAD_NAME=y
CONFIG_SCHED_CPU_MASK=y

#compiler optimization
CONFIG_SIZE_OPTIMIZATIONS=y

#optimizazions
CONFIG_BOOT_BANNER=n
CONFIG_DEBUG=n
#CONFIG_GPIO=n
CONFIG_SPI=n
CONFIG_I2C=n
