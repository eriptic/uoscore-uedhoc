# Debug output of the library and of the tests (DEBUG_PRINT). It prints every
# message and key, about 300 KB per test run, so it is off by default. Use it
# when you develop or debug a test:
#
#   west build -b native_sim -d build/debug test -- -DEXTRA_CONF_FILE=overlay-debug.conf
CONFIG_UOSCORE_DEBUG=y
CONFIG_UEDHOC_DEBUG=y
