name: build & test

on: [push, pull_request]

jobs:
# This workflow contains 2 jobs build and test

  build:
    name: Build uoscore-uedhoc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

# All build and test steps run inside the dev container defined in
# .devcontainer/, so CI uses the same toolchain as local development.
      - name: Install dev container CLI
        run: npm install -g @devcontainers/cli@0.89.0

      - name: Build and start dev container
        run: devcontainer up --workspace-folder .

### build, test and archive
# standalone CMake build of the library (top-level CMakeLists.txt)
      - name: Build library (standalone CMake)
        run: |
           devcontainer exec --workspace-folder . bash -ec '
             bash test/ci_scripts/test_library_standalone.sh'

# Zephyr tests: every configuration in test/tests.yaml on its CI boards.
# The dev container's Ninja (>= 1.13) shares Twister's job server, so the
# parallel builds do not overload the runner.
      - name: Run tests (Twister)
        run: |
           devcontainer exec --workspace-folder . bash -ec '
             west twister -T test --integration --outdir twister-out --inline-logs'

      - name: Archive test reports and static libs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister
          path: |
            twister-out/twister.json
            twister-out/twister.xml
            twister-out/**/uoscore_uedhoc.default/modules/uoscore-uedhoc/*.a

# Build Linux samples
      - name: Build linux samples
        run: |
           devcontainer exec --workspace-folder . bash -ec '
             cd test/
             bash ci_scripts/test_samples.sh'

### Generate ROM report
      - name: Generate ROM report
        run: |
           devcontainer exec --workspace-folder . bash -ec '
             cd test/
             bash ci_scripts/flash_report_gen.sh'

      - name: Upload rom report with tinycrypt
        uses: actions/upload-artifact@v4
        with:
          name: rom-report-tinycrypt-crypto
          path: test/build_reports/rom_report_nrf91_with_tinycrypt.txt

      - name: Upload rom report with mbedtls
        uses: actions/upload-artifact@v4
        with:
          name: rom-report-mbedtls-crypto
          path: test/build_reports/rom_report_nrf91_with_mbedtls.txt

### Generate stack report
      - name: Generate stack report
        run: |
           devcontainer exec --workspace-folder . bash -ec '
             cd test/
             bash ci_scripts/stack_report_gen.sh'

      - name: Upload stack report
        uses: actions/upload-artifact@v4
        with:
          name: stack-report
          path: test/build_reports/stack_report.html

### Generate test coverage report
      - name: Build native_sim with coverage information
        run: |
           devcontainer exec --workspace-folder . bash -ec '
             cd test/
             rm -rf build
             west build -b native_sim -- -DCONFIG_COVERAGE=y
             west build -t run
             lcov --capture --directory ./ --output-file lcov.info -q --rc branch_coverage=1 --ignore-errors inconsistent,mismatch
             genhtml lcov.info --output-directory lcov_html -q --ignore-errors source,inconsistent,corrupt --branch-coverage --legend
             tar -zcvf github-pages.tar.gz lcov_html'

      - name: Upload test coverage report
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: test/lcov_html


  # Deploy job
  deploy:
    # Add a dependency to the build job
    needs: build
    if: github.ref == 'refs/heads/main'

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
